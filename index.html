    <!-- Inline pre-paint theme resolution: prevents flash of unstyled theme (FOUT) -->
    <script>
      (function () {
        try {
          var storageKey = 'studyflow_theme';
          var defaultTheme = 'light';
          var validThemes = ['system', 'light', 'dark', 'midnight', 'sepia', 'ocean', 'forest', 'rose'];
          var darkThemes = ['dark', 'midnight', 'ocean', 'forest'];
          var themeColors = {
            light: '#fbf9f5',
            dark: '#0f172a',
            midnight: '#05070d',
            sepia: '#f5ebd7',
            ocean: '#0a1526',
            forest: '#0a1811',
            rose: '#fdf2f4'
          };

          var preference = 'system';
          if (typeof window !== 'undefined' && window.localStorage) {
            var stored = window.localStorage.getItem(storageKey);
            if (stored !== null) {
              if (validThemes.indexOf(stored) !== -1) {
                preference = stored;
              } else {
                preference = defaultTheme;
              }
            }
          }

          var resolved = preference;
          if (preference === 'system') {
            var isDark = false;
            if (typeof window !== 'undefined' && window.matchMedia) {
              isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            resolved = isDark ? 'dark' : 'light';
          }

          var root = document.documentElement;
          for (var i = 0; i < validThemes.length; i++) {
            if (validThemes[i] !== 'system') {
              root.classList.remove(validThemes[i]);
            }
          }
          root.classList.remove('dark');

          root.classList.add(resolved);
          root.setAttribute('data-theme', resolved);
          if (darkThemes.indexOf(resolved) !== -1) {
            root.classList.add('dark');
          }

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && themeColors[resolved]) {
            meta.setAttribute('content', themeColors[resolved]);
          }
        } catch (e) {
          // Never throw on pre-paint theme initialization
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
